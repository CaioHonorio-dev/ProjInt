<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TÍTULO: troque "Metalmecânica" pelo núcleo correspondente em cada página (Automação, Metalmecânica, Gestão...) -->
  <title>Núcleo de Metalmecânica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CABEÇALHO UNIFICADO -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <img src="css/imgs/SENAI_logo_2024.png" alt="Logo SENAI" class="logo" />
      </a>
      <nav class="nav-principal">
        <ul class="nav-lista">
          <li><a href="index.html" class="nav-link">Início</a></li>
          <li><a href="explicacao.html" class="nav-link">Como fazer seu Projeto</a></li>
          <li><a href="repositorio.html" class="nav-link ativo">Repositório de Núcleos</a></li>
        </ul>
      </nav>
         <!-- ===================== MODO ESCURO ===================== -->
<button class="tema-toggle" id="temaToggle" aria-label="Ativar modo escuro">
    <svg id="iconeTema" width="25" height="25" viewBox="0 0 24 24"></svg>
</button>
         <!-- ===================== MENU MOBILE ===================== -->
      <button class="menu-toggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="card card-busca">

    <a href="repositorio.html" class="botao-voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Voltar ao repositório
    </a>

    <!-- Troque "Metalmecânica" pelo nome do núcleo desta página -->
    <h2 class="busca-titulo">Núcleo de Metalmecânica</h2>    <p class="secao-subtitulo">Explore projetos, trabalhos e soluções desenvolvidos na área de Metalmecânica.</p>

   <div class="busca-barra">

  <span class="busca-icone" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </span>

  <input
    type="text"
    id="nomeArquivo"
    placeholder="Buscar arquivo..."
    autocomplete="off"
  >

  <!-- FILTRO DE ANO -->
  <select id="anoArquivo" aria-label="Selecionar ano" disabled>
    <option value="">Carregando anos...</option>
  </select>

  <!-- FILTRO DE TIPO -->
  <select id="tipoArquivo" aria-label="Selecionar tipo de arquivo">
    <option value="">Todos os tipos</option>
    <option value=".pdf">PDF</option>
    <option value=".docx">Word (.docx)</option>
    <option value=".xlsx">Excel (.xlsx)</option>
    <option value=".png">Imagem (.png)</option>
    <option value=".jpg">Imagem (.jpg)</option>
  </select>

</div>

   <div class="result-area" id="areaResultado">
  <span class="resultado-vazio">
    As pastas aparecerão aqui...
  </span>
</div>

<div id="paginacao"></div>
  </main>

  <!-- RODAPÉ UNIFICADO -->
  <footer class="rodape">
    <div class="rodape-container">
      <img src="css/imgs/SENAI_logo_2024.png" alt="Logo SENAI" class="rodape-logo" />
      <p class="rodape-texto">&copy; <span id="ano-atual"></span> SENAI. Plataforma de apoio à criação de Projetos integradores.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/script2.js"></script>
  <script>
    document.getElementById('ano-atual').textContent = new Date().getFullYear();
  </script>
</body>
</html>
